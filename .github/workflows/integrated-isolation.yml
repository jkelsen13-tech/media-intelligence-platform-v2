name: Targeted standalone Deno candidate boot
on:
  push:
    branches: ['candidate/qik-deno-zero-eof-20260925']
permissions:
  contents: read
jobs:
  deno-boot:
    if: >-
      github.repository == 'jkelsen13-tech/media-intelligence-platform-v2' &&
      github.ref == 'refs/heads/candidate/qik-deno-zero-eof-20260925' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.before == 'be392417c05a6d7a9145f6c920c2267b73214d03'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      DENO_REVIEWED_SOURCE: be392417c05a6d7a9145f6c920c2267b73214d03
      DENO_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Exact source and bounded standalone Deno boot
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$DENO_REVIEWED_SOURCE" HEAD -- . ':!.github/workflows/integrated-isolation.yml' ':!.github/workflows/golden.yml'
          git rev-parse HEAD HEAD^{tree}
          timeout --signal=TERM --kill-after=2s 60s bash <<'DENO_BOUND'
          set -euo pipefail
          timeout --signal=TERM --kill-after=1s 10s node --test --test-name-pattern="bounded body admission|body framing refusal|one zero-byte chunk" tests/qikWorkerHost.test.mjs
          [[ "$DENO_RUN" =~ ^[0-9]+$ ]]
          runtime_dir="$RUNNER_TEMP/mip-qik-deno-$DENO_RUN"
          container="mip-qik-deno-$DENO_RUN"
          test ! -e "$runtime_dir"
          if docker container inspect "$container" >/dev/null 2>&1; then exit 1; fi
          mkdir -m 755 -- "$runtime_dir"
          test "$(realpath -- "$runtime_dir")" = "$RUNNER_TEMP/mip-qik-deno-$DENO_RUN"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 25 --max-filesize 41596794 \
            'https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip' -o "$runtime_dir/deno.zip"
          test "$(stat -c %s "$runtime_dir/deno.zip")" = 41596794
          printf '%s  %s\n' 'c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490' "$runtime_dir/deno.zip" | sha256sum --check -
          test "$(unzip -Z1 "$runtime_dir/deno.zip")" = deno
          unzip -q "$runtime_dir/deno.zip" -d "$runtime_dir"
          chmod 755 "$runtime_dir/deno"
          docker pull python@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
          docker run --name "$container" --label "mip.deno.run=$DENO_RUN" \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --user 65534:65534 --memory 256m --pids-limit 32 --ulimit core=0 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$runtime_dir/deno,target=/usr/local/bin/deno,readonly" \
            --workdir /workspace -e DENO_DIR=/tmp/deno -e DENO_NO_UPDATE_CHECK=1 -e NO_COLOR=1 \
            --entrypoint /bin/sh python@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7 -ec '
              deno --version
              deno --version | grep -q "^deno 2.9.7 "
              help="$(deno run --help)"
              for flag in --no-config --no-lock --no-npm --no-remote --cached-only --no-code-cache --no-prompt --allow-read --allow-env --allow-net; do
                case "$help" in *"$flag"*) ;; *) exit 1 ;; esac
              done
              deno run --no-config --no-lock --no-npm --no-remote --cached-only --no-code-cache --no-prompt \
                --allow-read=/workspace \
                --allow-env=MIP_QIK_WORKER_RPC_URL,MIP_QIK_PUBLISHABLE_KEY,MIP_QIK_WORKER_JWT,MIP_QIK_WORKER_INVOKE_TOKEN,MIP_QIK_WORKER_SESSION,MIP_QIK_WORKER_RUNTIME,MIP_QIK_WORKER_IMPLEMENTATION \
                --allow-net=0.0.0.0:8000,127.0.0.1:8000 verifier/news-intake/qik_deno_boot.mjs'
          docker inspect "$container" --format 'DENO_BOUNDARY network={{.HostConfig.NetworkMode}} ports={{json .HostConfig.PortBindings}} memory={{.HostConfig.Memory}} pids={{.HostConfig.PidsLimit}} exit={{.State.ExitCode}}'
          DENO_BOUND
      - name: Owned runtime cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DENO_RUN" =~ ^[0-9]+$ ]]
          container="mip-qik-deno-$DENO_RUN"
          if docker container inspect "$container" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{index .Config.Labels "mip.deno.run"}}' "$container")" = "$DENO_RUN"
            timeout --kill-after=1s 5s docker rm -f -v "$container" >/dev/null
          fi
          runtime_dir="$RUNNER_TEMP/mip-qik-deno-$DENO_RUN"
          if test -d "$runtime_dir"; then
            test "$(realpath -- "$runtime_dir")" = "$RUNNER_TEMP/mip-qik-deno-$DENO_RUN"
            for file in "$runtime_dir/deno" "$runtime_dir/deno.zip"; do
              if test -f "$file"; then rm -- "$file"; fi
            done
            rmdir -- "$runtime_dir"
          fi
          if docker container inspect "$container" >/dev/null 2>&1; then exit 1; fi
          test ! -e "$runtime_dir"
          printf '%s\n' DENO_OWNED_RUNTIME_CLEANUP_PASS
