# Temporary, source-free R1/R5 execution on the existing registered workflow.
# Restore f4f7aa374fbf51c3f3e71605c4110ca38a4353f6 version after terminal receipt.
name: Integrated isolated candidate
on:
  push:
    branches: ['candidate/r5-ongoing-synthetic-20260925']
permissions:
  contents: read
jobs:
  ongoing-intake-comparison:
    name: R1 R5 native ongoing intake and comparison
    if: github.event_name == 'push' && github.ref == 'refs/heads/candidate/r5-ongoing-synthetic-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 3
      - name: Verify reviewed identity and prepare existing source-free utility
        env:
          R5_REVIEWED_SOURCE: 65c13dfa82eafe1b9a49b99852c7a3dd070d06bf
          R5_EXECUTION_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R5_EXECUTION_SHA"
          git diff --exit-code "$R5_REVIEWED_SOURCE" HEAD -- verifier supabase
          git rev-parse HEAD HEAD^{tree}
          ! grep -q extraheader .git/config
          node_binary="$(readlink -f "$(command -v node)")"
          test -f "$node_binary"
          printf 'R5_NODE_BINARY_SHA256 '
          sha256sum "$node_binary"
          printf 'R5_NODE_BINARY=%s\n' "$node_binary" >> "$GITHUB_ENV"
          docker pull postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          docker build -f verifier/integrated/native-path.Dockerfile -t mip-r5-utility verifier/integrated
          docker image inspect postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929 mip-r5-utility --format 'RUNTIME {{.Id}} {{json .RepoDigests}}'
          # Fail closed if the existing runner binary is incompatible with the
          # existing pinned Python image. No alternate image or dependency fallback.
          docker run --rm --name mip-r5-node-check --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 65534:65534 --memory 64m --pids-limit 16 \
            --mount "type=bind,source=$node_binary,target=/usr/local/bin/node,readonly" \
            --entrypoint /usr/local/bin/node mip-r5-utility --version
      - name: Execute only changed integration boundary in isolation
        shell: bash
        run: |
          set -euo pipefail
          docker volume create mip-r5-socket
          docker run -d --name mip-r5-pg --network none --memory 512m --pids-limit 128 \
            --security-opt no-new-privileges:true \
            --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=256m \
            --mount type=volume,source=mip-r5-socket,target=/var/run/postgresql \
            -e POSTGRES_PASSWORD=mip-r5-disposable-only postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          stable=0
          for attempt in $(seq 1 40); do
            if docker exec mip-r5-pg pg_isready -U postgres >/dev/null 2>&1; then stable=$((stable + 1)); else stable=0; fi
            if [ "$stable" -ge 5 ]; then break; fi
            test "$attempt" -lt 40
            sleep 1
          done
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' mip-r5-pg)" = none
          test -z "$(docker port mip-r5-pg)"
          docker exec mip-r5-pg createdb -U postgres mip_r5
          docker exec mip-r5-pg psql -X -U postgres -d mip_r5 -Atc \
            "select current_database(),current_user,current_setting('server_version'),inet_server_addr();"
          docker run --rm --name mip-r5-exercise --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 65534:65534 --memory 256m --pids-limit 32 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount type=volume,source=mip-r5-socket,target=/var/run/postgresql,readonly \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$R5_NODE_BINARY,target=/usr/local/bin/node,readonly" \
            -e MIP_R5_ISOLATION=network-none-socket-only \
            mip-r5-utility /workspace/verifier/news-intake/ongoing_intake_comparison.py
          docker inspect mip-r5-pg --format 'BOUNDARY network={{.HostConfig.NetworkMode}} ports={{json .HostConfig.PortBindings}} memory={{.HostConfig.Memory}} pids={{.HostConfig.PidsLimit}}'
      - name: Fail-closed disposable cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f -v mip-r5-node-check mip-r5-exercise mip-r5-pg >/dev/null 2>&1 || true
          docker volume rm mip-r5-socket >/dev/null 2>&1 || true
          docker image rm mip-r5-utility >/dev/null 2>&1 || true
          test -z "$(docker ps -aq --filter name=^/mip-r5-node-check$)"
          test -z "$(docker ps -aq --filter name=^/mip-r5-exercise$)"
          test -z "$(docker ps -aq --filter name=^/mip-r5-pg$)"
          ! docker volume inspect mip-r5-socket >/dev/null 2>&1
          ! docker image inspect mip-r5-utility >/dev/null 2>&1
