name: Collector shadow PostgreSQL concurrency
on:
  pull_request:
    paths:
      - 'supabase/qualification/collector-algorithm-shadow/**'
      - 'supabase/functions/collector-algorithm-shadow-candidate/**'
      - 'tests/collectorAlgorithmShadowSqlContract.test.mjs'
      - 'tests/collectorShadowPostgresHarness.test.mjs'
      - 'verifier/collectorShadowPostgresConcurrency.py'
      - '.github/workflows/collector-shadow-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-concurrency:
    if: ${{ github.ref != 'refs/heads/codex/mip-backend-consolidation-20260920' && github.head_ref != 'codex/mip-backend-consolidation-20260920' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: mip-shadow-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Qualify direct logins, concurrency, recovery, and restart
        env:
          MIP_DISPOSABLE_POSTGRES: collector-shadow-qualification
        run: python3 -B verifier/collectorShadowPostgresConcurrency.py
