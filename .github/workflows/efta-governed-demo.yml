name: EFTA bounded review proposal
on:
  push:
    branches: ['codex/mip-post-lane-a-governed-demo-20260916']
  pull_request:
    paths:
      - 'supabase/qualification/mip-cutover-authority/011_efta_governed_review.sql'
      - 'supabase/qualification/mip-cutover-authority/efta*.mjs'
      - 'src/lib/efta*.js'
      - 'src/components/EftaGovernedWorkspace.jsx'
      - 'src/App.jsx'
      - 'docs/EFTA_GOVERNED_DEMO_2026-09-16.md'
      - 'verifier/efta-governed-demo/**'
      - 'tests/efta*.test.mjs'
      - '.github/workflows/efta-governed-demo.yml'
permissions:
  contents: read
jobs:
  proposal:
    if: ${{ github.ref != 'refs/heads/codex/mip-backend-consolidation-20260920' && github.head_ref != 'codex/mip-backend-consolidation-20260920' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/efta*.test.mjs
      - run: npm test
      - run: npm run build
