name: Prepare comparison binding migration
on:
  push:
    branches: [prep/comparison-event-binding-20260909]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npx --yes supabase@2.117.0 migration new --help
      - run: npx --yes supabase@2.117.0 migration new comparison_explanation_event_binding
      - run: node -e "const fs=require('node:fs'); console.log('MIP_MIGRATION_NAME='+fs.readdirSync('supabase/migrations').find(x=>x.endsWith('_comparison_explanation_event_binding.sql')))"
