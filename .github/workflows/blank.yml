name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # G1 deployment gate: the golden regression suite must pass before any
  # deploy. A reintroduced known-bad relationship, classification,
  # sanitization, duplicate, fallback, or cleanup failure blocks the site.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Sandbox-only build target. VITE_* values are public client settings once
      # bundled; this disposable project has RLS and no production fallback.
      VITE_SUPABASE_URL: https://yhbwnrtlqbjtcrrlpbge.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_VB9q-7kUl_9zqi_K1-lVYw_Q9XCL_M2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
