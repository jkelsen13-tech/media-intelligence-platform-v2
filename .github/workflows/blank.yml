name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # G1 deployment gate: the golden regression suite must pass before any
  # deploy. A reintroduced known-bad relationship, classification,
  # sanitization, duplicate, fallback, or cleanup failure blocks the site.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # V2-only Pages build target. VITE_* values are public client settings
      # once bundled. Do not inject leftover Manus or paused-original hosts.
      # Actions secret VITE_SUPABASE_ANON_KEY is preferred when writable;
      # this repo's existing pattern is an in-workflow publishable key.
      VITE_SUPABASE_URL: https://qikvmopbtijoebdqosyq.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_7EVSYlCWYiE6YL0bDBYr_w_iwB9tve_
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: https://qikvmopbtijoebdqosyq.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_7EVSYlCWYiE6YL0bDBYr_w_iwB9tve_
      MIP_LIVE_SITE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Confirm deployed release assets
        run: node verifier/waitForLiveBuild.mjs
      - name: Install isolated browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/mip-browser" --no-package-lock --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/mip-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Verify live shared workspace
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runWorkspaceShellBrowser.mjs
      - name: Verify live weather and navigation boundaries
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runWeatherRightsBrowser.mjs
      - name: Verify live Timeline and recovery
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runTimelineCompositionBrowser.mjs
      - name: Verify live Timeline in WebKit
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
          MIP_TIMELINE_BROWSER: webkit
        run: node verifier/runTimelineCompositionBrowser.mjs

      - name: Verify live Graph Time evidence selection
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runGraphTimeBrowser.mjs
