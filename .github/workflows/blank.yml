name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # G1 deployment gate: the golden regression suite must pass before any
  # deploy. A reintroduced known-bad relationship, classification,
  # sanitization, duplicate, fallback, or cleanup failure blocks the site.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # V2-only Pages build target. VITE_* values are public client settings
      # once bundled. Do not inject leftover Manus or paused-original hosts.
      # Actions secret VITE_SUPABASE_ANON_KEY is preferred when writable;
      # this repo's existing pattern is an in-workflow publishable key.
      VITE_SUPABASE_URL: https://qikvmopbtijoebdqosyq.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_7EVSYlCWYiE6YL0bDBYr_w_iwB9tve_
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
