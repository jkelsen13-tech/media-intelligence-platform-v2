name: Qik operational adapter synthetic qualification
on:
  push:
    branches: [codex/qik-operational-integration-20260927]
    paths: [.github/workflows/qik-operational-adapter-synthetic.yml]
permissions:
  contents: read
concurrency:
  group: qik-operational-adapter-synthetic
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.repository == 'jkelsen13-tech/media-intelligence-platform-v2' && github.ref == 'refs/heads/codex/qik-operational-integration-20260927'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify candidate dependency tree and synthetic authority
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import hashlib,os,pathlib,subprocess
          source='78d6df1f4ccf2f990aa6118e8a54718da31da72b'
          assert os.environ['GITHUB_EVENT_NAME']=='push'
          assert os.environ['GITHUB_REPOSITORY']=='jkelsen13-tech/media-intelligence-platform-v2'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/qik-operational-integration-20260927'
          assert subprocess.check_output(['git','rev-parse',source+'^{tree}'],text=True).strip()=='767e10fb2f71d8c13298784fca073ee9ce00f690'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          subprocess.run(['git','merge-base','--is-ancestor',source,'HEAD'],check=True)
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines()==['.github/workflows/qik-operational-adapter-synthetic.yml']
          pins={"supabase/qualification/native-comparison-display/001_private_display.sql":"6602515e55fe7cb70bba1e505a2d3e21b94398e5","supabase/qualification/native-comparison-display/displayContract.mjs":"1bfd19145470aca6ccea34f461085ee9cc255960","supabase/qualification/native-comparison-display/serverRoute.mjs":"94ecb69bf660563b7921a9991b4f1b4cb328e532","supabase/qualification/native-comparison-display/README.md":"499e7252dee0b3043dff54e3b11e701d85efacbd","supabase/qualification/native-comparison-display/contract.json":"ab6dec0faad0ecc03370f6a7ad5cacf293993aa4","tests/nativeComparisonDisplay.test.mjs":"29006a483186fa0b09095421920d8c586ed7d6ab","tests/nativeComparisonDisplayAssertions.mjs":"194ae7ec92349754e6dd27f04137307aadd28306","tests/nativeComparisonBindingFixture.mjs":"f0dcec386460b00d83fc4a828535d679a7f3f070","supabase/qualification/native-governed-install/install.mjs":"7fbf4831d1bbdc5ffd33ac5d0c83aff124285e6c","supabase/qualification/qik-comparison-adapter/atomicInstall.mjs":"a9942e32cfeb4d807834bf64df5f496939105c18","tests/nativeGovernedInstallerPostgres17.test.mjs":"3a99cfa646a96ab02523033a13a8d1e72354d515","supabase/qualification/native-governed-install/README.md":"dbf13c74c13099ec5b0948055adbd024a69d9493","tests/nativeArcCohortPostgres17.test.mjs":"dd6dbee189bb326cc26c9ba4eb4c7100810b691a","verifier/qik-governed-c6-c9-successor.json":"f70a2570275d33675dc6702e9426c8243d420579","supabase/qualification/historical-qik-executor/install.mjs":"d4c72b5e2ff50ce19d46de9c6911135fc0216f48"}
          for name,blob in pins.items():
              body=pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==blob
          protected={'verifier/efta-postgres-qualification-manifest.json':'841e0fe52244c224330efd546965f57571549fd7ae08bc07d19853134241c6f9','verifier/eftaPostgresQualification.py':'000eac69f781f1803c19d98ac44388400ee8324feeeb4cd6498e8a984ef65f10'}
          for name,digest in protected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest
          config=subprocess.run(['git','config','--get-regexp','http.*.extraheader'],capture_output=True)
          assert config.returncode==1 and not config.stdout
          print('Pinned complete candidate tree; canonical writer, complete private membership, bound private display, separately preserved v2/v3/v4 plus v5 restricted-principal joint installer and actual ordered main-to-historical compatibility and exact dual-reader native comparison binding and historical projection fixture await applicable fresh actual Cursor review after applicable tests. Synthetic-only internal qualification under user consolidation amendment. Not owner field signature, historical acceptance, hosted installation or material-transfer authority.')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify combined occurrence, replay and nested retention contracts
        run: node --test tests/arcMembershipPrepared.test.mjs tests/collectorRetainedExtraction.test.mjs tests/retainedExtraction.test.mjs tests/nativeEntityOccurrences.test.mjs tests/arcMembershipRetained.test.mjs tests/qikC6C9RetentionSuccessor.test.mjs tests/nativeArcScoring.test.mjs tests/nativeComparisonServerCaller.test.mjs tests/nativeComparisonDisplay.test.mjs tests/mipHistoricalArticleTransferPlan.test.mjs tests/mipHistoricalArticleTransfer.test.mjs
      - name: Start disposable PostgreSQL 17.6 on loopback only
        shell: bash
        run: |
          docker run --detach --name qik-op-qualification --publish 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=mip-efta-disposable-ci-only -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          for attempt in $(seq 1 30); do
            if docker exec qik-op-qualification pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Qualify native field admission and consumers on actual PostgreSQL
        timeout-minutes: 3
        env:
          MIP_NATIVE_MENTION_DISPOSABLE: synthetic-pg17-only
        run: node --test tests/nativeMentionFieldsPostgres17.test.mjs
      - name: Qualify arc preparation with actual PostgreSQL snapshot and permissions
        timeout-minutes: 3
        shell: bash
        env:
          MIP_DISPOSABLE_POSTGRES: arc-membership-prepared
          MIP_ARC_PREPARED_DATABASE_URL: postgres://postgres:mip-efta-disposable-ci-only@127.0.0.1:5432/mip_arc_prepared_test
        run: |
          set -euo pipefail
          test "$(docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification psql -X -h 127.0.0.1 -U postgres -Atc "show server_version_num")" = 170006
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification createdb -h 127.0.0.1 -U postgres mip_arc_prepared_test
          node --test tests/arcMembershipPreparedPostgres.test.mjs
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification dropdb -h 127.0.0.1 -U postgres mip_arc_prepared_test
      - name: Qualify physical native occurrence admission and exact retries
        timeout-minutes: 3
        shell: bash
        env:
          MIP_NATIVE_ENTITY_OCCURRENCES_DISPOSABLE: synthetic-pg17-only
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification createdb -h 127.0.0.1 -U postgres mip_native_occurrences_test
          node --test tests/nativeEntityOccurrencesPostgres17.test.mjs
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification dropdb -h 127.0.0.1 -U postgres mip_native_occurrences_test
      - name: Qualify retained historical arc context and effective private permissions
        timeout-minutes: 3
        shell: bash
        env:
          MIP_DISPOSABLE_POSTGRES: arc-membership-retained
          MIP_ARC_RETAINED_DATABASE_URL: postgres://postgres:mip-efta-disposable-ci-only@127.0.0.1:5432/mip_arc_retained_test
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification createdb -h 127.0.0.1 -U postgres mip_arc_retained_test
          node --test tests/arcMembershipRetainedPostgres.test.mjs
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification dropdb -h 127.0.0.1 -U postgres mip_arc_retained_test
      - name: Qualify exact candidate review and effective gateway boundaries
        timeout-minutes: 3
        shell: bash
        env:
          MIP_NATIVE_CANDIDATE_REVIEW_DISPOSABLE: synthetic-pg17-only
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification createdb -h 127.0.0.1 -U postgres mip_candidate_review_test
          node --test tests/nativeCandidateReviewPostgres17.test.mjs
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification dropdb -h 127.0.0.1 -U postgres mip_candidate_review_test
      - name: Qualify qik DATE RLS storage and unqualified authority refusal
        timeout-minutes: 3
        shell: bash
        env:
          MIP_DISPOSABLE_POSTGRES: arc-membership-qik-source
          MIP_ARC_QIK_SOURCE_DATABASE_URL: postgres://postgres:mip-efta-disposable-ci-only@127.0.0.1:5432/mip_arc_qik_source_test
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification createdb -h 127.0.0.1 -U postgres mip_arc_qik_source_test
          node --test tests/arcMembershipQikSourcePostgres.test.mjs
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification dropdb -h 127.0.0.1 -U postgres mip_arc_qik_source_test
      - name: Qualify governed canonical admission and exact projection readers
        timeout-minutes: 3
        shell: bash
        env:
          MIP_NATIVE_CANONICAL_ADMISSION_DISPOSABLE: synthetic-pg17-only
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification createdb -h 127.0.0.1 -U postgres mip_canonical_admission_test
          node --test tests/nativeCanonicalAdmissionPostgres17.test.mjs
          docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification dropdb -h 127.0.0.1 -U postgres mip_canonical_admission_test
      - name: Remove helper-test container before full installation qualification
        if: always()
        shell: bash
        run: |
          if docker container inspect qik-op-qualification >/dev/null 2>&1; then
            volumes=$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}' qik-op-qualification)
            docker rm --force --volumes qik-op-qualification
            for volume in $volumes; do
              if docker volume inspect "$volume" >/dev/null 2>&1; then echo 'Disposable volume remains'; exit 1; fi
            done
          fi
          if docker container inspect qik-op-qualification >/dev/null 2>&1; then exit 1; fi
      - name: Start pristine PostgreSQL 17.6 for the full ordered installation
        shell: bash
        run: |
          docker run --detach --name qik-op-qualification --publish 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=mip-efta-disposable-ci-only -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          for attempt in $(seq 1 30); do
            if docker exec qik-op-qualification pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Build pinned pgvector 0.8.2 for the actual hosted shape
        id: vector_build
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u root qik-op-qualification bash -euc '
            apt-mark hold postgresql-17 postgresql-client-17
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential curl ca-certificates postgresql-server-dev-17
            install -d -m 700 /tmp/qik-vector-build
            cd /tmp/qik-vector-build
            curl --fail --location --max-time 45 --proto "=https" --tlsv1.2 https://codeload.github.com/pgvector/pgvector/tar.gz/cab9da72c04353f143bb06b42ab70a403daac64a -o vector.tar.gz
            echo "0af705b6c9b2a3a1fd1f6fd991425c125387d3c8edc68b75ef027d2e0a05e57a  vector.tar.gz" | sha256sum -c -
            tar -xzf vector.tar.gz --strip-components=1
            make -j2 PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config OPTFLAGS=""
            make PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config install
            dpkg-query -W build-essential postgresql-server-dev-17 postgresql-17 postgresql-client-17
            rm -rf /tmp/qik-vector-build
          '
          test "$(docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification psql -X -h 127.0.0.1 -U postgres -Atc "show server_version_num")" = 170006
      - name: Qualify complete native arc installation journal review and reader
        timeout-minutes: 5
        env:
          MIP_NATIVE_ARC_COHORT_DISPOSABLE: synthetic-pg17-only
          MIP_QIK_COMPARISON_DISPOSABLE: synthetic-pg17-only
          MIP_DISPOSABLE_POSTGRES: qik-persistent-install
        run: node --test tests/nativeArcCohortPostgres17.test.mjs
      - name: Qualify joint governed installation as the actual restricted principal
        # Independent synthetic fixture with its own pristine-cluster guard.
        # A failed C9 check still fails the combined job and prevents acceptance.
        if: ${{ !cancelled() && steps.vector_build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          MIP_NATIVE_GOVERNED_INSTALL_DISPOSABLE: synthetic-pg17-only
          MIP_QIK_COMPARISON_DISPOSABLE: synthetic-pg17-only
          MIP_DISPOSABLE_POSTGRES: qik-persistent-install
        run: node --test tests/nativeGovernedInstallerPostgres17.test.mjs
      - name: Qualify recovered historical projection and atomic attachment dependencies
        # Independent absent-only synthetic database and role; cleanup is guarded.
        # This does not qualify native publication or bypass any failed gate.
        if: ${{ !cancelled() && steps.vector_build.outcome == 'success' }}
        timeout-minutes: 4
        env:
          MIP_ARC_PUBLIC_PROJECTION_DISPOSABLE: synthetic-pg17-only
          MIP_DISPOSABLE_POSTGRES: qik-persistent-install
        run: node --test tests/nativeArcPublicProjectionPostgres17.test.mjs
      - name: Remove disposable database and verify no container or volume remains
        if: always()
        shell: bash
        run: |
          if docker container inspect qik-op-qualification >/dev/null 2>&1; then
            volumes=$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}' qik-op-qualification)
            docker rm --force --volumes qik-op-qualification
            for volume in $volumes; do
              if docker volume inspect "$volume" >/dev/null 2>&1; then echo 'Disposable volume remains'; exit 1; fi
            done
          fi
          if docker container inspect qik-op-qualification >/dev/null 2>&1; then exit 1; fi
