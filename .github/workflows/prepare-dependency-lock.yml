name: Prepare bounded dependency lock
on:
  push:
    branches: ['codex/compatible-build-dependency-patches']
    paths: ['.github/workflows/prepare-dependency-lock.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Resolve compatible lock metadata without executing packages
        run: |
          cp package-lock.json "$RUNNER_TEMP/mip-lock-before.json"
          npm update postcss nanoid --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/mip-lock-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const changed=Object.keys(after.packages).filter(k=>JSON.stringify(before.packages[k])!==JSON.stringify(after.packages[k]));
          const removed=Object.keys(before.packages).filter(k=>!after.packages[k]);
          console.log('MIP_LOCK_CHANGES='+JSON.stringify({changed:changed.map(k=>({path:k,before:before.packages[k],after:after.packages[k]})),removed}));
          console.log('MIP_LOCK_JSON='+JSON.stringify(after));
          NODE
