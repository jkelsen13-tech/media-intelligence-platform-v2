name: Actor revision and agency qualification
on:
  pull_request:
    paths:
      - 'supabase/qualification/entity-resolution/**'
      - 'verifier/agency-resolution/**'
      - 'docs/AGENCY_IDENTITY_SLICE2_2026-09-14.md'
      - '.github/workflows/agency-identity-qualification.yml'
permissions:
  contents: read
jobs:
  synthetic:
    if: ${{ github.ref != 'refs/heads/codex/mip-backend-consolidation-20260920' && github.head_ref != 'codex/mip-backend-consolidation-20260920' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: mip-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Record exact candidate identity
        run: git rev-parse HEAD HEAD^{tree}
      - name: Actor revision and agency contracts with native PostgreSQL
        env:
          MIP_MENTION_QUALIFICATION: disposable-only
        run: node --test verifier/agency-resolution/*.test.mjs
