name: Markets candidate outer SQL parser
on:
  pull_request:
    paths:
      - 'supabase/production-candidates/markets-graph-compatibility/**'
      - '.github/workflows/markets-outer-sql.yml'
permissions:
  contents: read
jobs:
  outer-sql:
    name: Seven-file outer SQL parser (no database qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE: supabase/production-candidates/markets-graph-compatibility
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'Outer-parser input commit: %s\n' "$EXPECTED_HEAD"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: 'x64'
          check-latest: false
      - name: Create clean environment and install hash-locked parser
        shell: bash
        run: |
          set -euo pipefail
          python -I -c "import sys; sys.exit(0 if sys.version_info[:3] == (3, 12, 10) else 1)"
          test ! -e "$RUNNER_TEMP/markets-parser"
          python -I -m venv "$RUNNER_TEMP/markets-parser"
          "$RUNNER_TEMP/markets-parser/bin/python" -I -m pip --isolated install \
            --index-url https://pypi.org/simple --require-hashes --only-binary=:all: \
            --no-deps --no-cache-dir --disable-pip-version-check \
            -r "$CANDIDATE/parser-requirements.txt"
          "$RUNNER_TEMP/markets-parser/bin/python" -I -m pip --isolated check
      - name: Input-contract adversarial tests (normal and optimized Python)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/markets-parser/bin/python" -I "$CANDIDATE/test-parse-sql.py"
          "$RUNNER_TEMP/markets-parser/bin/python" -I -O "$CANDIDATE/test-parse-sql.py"
      - name: Parse all seven exact-head SQL files
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/markets-parser/bin/python" -I "$CANDIDATE/parse-sql.py"
          printf '%s\n' 'Outer SQL only; PL/pgSQL, psql, generated SQL, catalog, index and concurrency qualification remain pending.'
