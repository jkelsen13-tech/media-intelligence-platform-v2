name: Content addressed storage qualification
on:
  pull_request:
    paths:
      - 'supabase/qualification/content-addressed-storage/**'
      - 'verifier/content-addressed-storage/**'
      - '.github/workflows/content-addressed-storage.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: mip-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Synthetic PostgreSQL and lossless retrieval qualification
        env:
          MIP_DISPOSABLE_POSTGRES: content-addressed-qualification
        run: node --test verifier/content-addressed-storage/native.test.mjs
