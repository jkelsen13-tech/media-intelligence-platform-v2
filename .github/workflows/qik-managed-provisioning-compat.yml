name: Qik managed provisioning compatibility (synthetic only)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact compatibility fixture commit
        required: true
        type: string
      mode:
        description: Bounded qualification scope
        required: true
        default: managed
        type: choice
        options:
          - managed
          - preflight
          - credentials
          - provisioning
          - combined
          - vault
permissions:
  contents: read
concurrency:
  group: qik-managed-provisioning-compat
  cancel-in-progress: false
jobs:
  compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate source identity
        env:
          EXPECTED: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$GITHUB_RUN_ATTEMPT" = 1
          git diff --exit-code
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Locked test driver
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Managed successor source and held host tests
        if: inputs.mode == 'provisioning' || inputs.mode == 'combined'
        run: node --test tests/nativeManagedActivationProfile.test.mjs supabase/qualification/native-provisioning-compat/host.test.mjs
      - name: Resolve exact managed image and create isolated instance
        if: inputs.mode != 'preflight'
        timeout-minutes: 5
        env:
          QUALIFICATION_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          provider_args=()
          if [ "$QUALIFICATION_MODE" = provisioning ] || [ "$QUALIFICATION_MODE" = combined ]; then
            provider_args=(-c supautils.privileged_role=supabase_privileged_role)
          fi
          docker pull supabase/postgres@sha256:b3bfedb107413abb3b8cb0d0874b0414a1dceb3d55bc0c778de6ad22d1f7dc86
          image=$(docker image inspect supabase/postgres@sha256:b3bfedb107413abb3b8cb0d0874b0414a1dceb3d55bc0c778de6ad22d1f7dc86 --format '{{index .RepoDigests 0}}')
          [[ "$image" =~ ^supabase/postgres@sha256:[a-f0-9]{64}$ ]]
          printf 'Managed image: %s\n' "$image"
          admin=$(openssl rand -hex 32)
          customer=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$admin"
          printf '::add-mask::%s\n' "$customer"
          printf 'MIP_COMPAT_ADMIN_PASSWORD=%s\nMIP_COMPAT_CUSTOMER_PASSWORD=%s\n' "$admin" "$customer" >> "$GITHUB_ENV"
          docker run --detach --name qik-managed-compat --publish 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD="$admin" "$image" postgres -D /etc/postgresql -c log_statement=none -c log_min_error_statement=panic -c log_parameter_max_length=0 -c log_parameter_max_length_on_error=0 -c pgaudit.log=none -c pgaudit.log_parameter=off -c pg_stat_statements.track=none -c log_min_duration_statement=-1 -c log_min_duration_sample=-1 -c log_transaction_sample_rate=0 -c log_duration=off -c auto_explain.log_min_duration=-1 "${provider_args[@]}"
          for attempt in $(seq 1 45); do
            if docker exec qik-managed-compat pg_isready -h 127.0.0.1 -U supabase_admin >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo 'Managed instance readiness failed; no raw database logs emitted'
          exit 1
      - name: Provider-only customer credential setup
        if: inputs.mode != 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import pg from 'pg';
          const db=new pg.Client({host:'127.0.0.1',port:5432,user:'supabase_admin',password:process.env.MIP_COMPAT_ADMIN_PASSWORD,database:'postgres'});
          try {
            await db.connect();
            const r=(await db.query("select current_user,session_user,current_setting('server_version_num') version,(select rolsuper from pg_roles where rolname='postgres') customer_super,current_setting('session_preload_libraries') preload")).rows[0];
            if(r.current_user!=='supabase_admin'||r.session_user!=='supabase_admin'||r.version!=='170006'||r.customer_super!==false||!r.preload.includes('supautils'))throw Error('managed_identity');
            const secret=process.env.MIP_COMPAT_CUSTOMER_PASSWORD;
            if(!/^[a-f0-9]{64}$/.test(secret))throw Error('credential_shape');
            await db.query("ALTER ROLE postgres PASSWORD '"+secret+"'");
            console.log('PASS provider customer-credential preparation; disputed customer steps not performed');
          } catch(e) {console.error('FAIL provider preparation '+(/^[A-Z0-9]{5}$/.test(e.code??'')?e.code:'bounded'));process.exitCode=1;}
          finally {await db.end();}
          JS
      - name: Require password authentication for synthetic loopback
        if: inputs.mode != 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u root qik-managed-compat sed -i -E '/^host[[:space:]]+all[[:space:]]+all[[:space:]]+(127\.0\.0\.1\/32|::1\/128)[[:space:]]+trust/s/trust/scram-sha-256/' /etc/postgresql/pg_hba.conf
          docker kill --signal HUP qik-managed-compat
      - name: Verify provider public CA identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cert="$RUNNER_TEMP/qik-public-ca.crt"
          trap 'rm -f "$cert"' EXIT
          curl --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 --max-filesize 16384 --fail --silent --show-error --output "$cert" 'https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt'
          test "$(sha256sum "$cert" | cut -d' ' -f1)" = '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7'
          echo 'PASS public provider CA matches existing pin'
      - name: Installer preflight source tests
        if: inputs.mode != 'vault'
        run: node --test tests/nativeProvisioningInstallerPreflight.test.mjs tests/nativeProvisioningPreflightHost.test.mjs
      - name: Restricted customer lifecycle qualification
        if: inputs.mode == 'managed'
        timeout-minutes: 5
        env:
          MIP_CUSTODIAN_LIFECYCLE_ARM: synthetic-pg17-local-only
          MIP_DISPOSABLE_POSTGRES: qik-persistent-install
        run: node --test --test-concurrency=1 supabase/qualification/native-provisioning-compat/managedDblink.test.mjs supabase/qualification/native-provisioning-compat/trustedInstallerAuditorLifecycle.test.mjs
      - name: Prepare representative customer logging defaults
        if: inputs.mode == 'credentials' || inputs.mode == 'provisioning' || inputs.mode == 'combined'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import pg from 'pg';
          const db=new pg.Client({host:'127.0.0.1',port:5432,user:'supabase_admin',password:process.env.MIP_COMPAT_ADMIN_PASSWORD,database:'postgres'});
          try {
            await db.connect();
            const defaults={log_statement:'ddl',log_min_error_statement:'error',log_parameter_max_length:'-1',log_parameter_max_length_on_error:'0',log_min_duration_statement:'-1',log_min_duration_sample:'-1',log_transaction_sample_rate:'0','pg_stat_statements.track':'top','pg_stat_statements.track_utility':'on','pgaudit.log':'none','pgaudit.log_parameter':'off','auto_explain.log_min_duration':'10000','auto_explain.log_nested_statements':'off','auto_explain.log_parameter_max_length':'-1'};
            for(const [name,value] of Object.entries(defaults))await db.query("ALTER ROLE postgres SET "+name+" TO '"+value+"'");
            console.log('PASS provider fixture mirrors qik customer logging defaults; customer cannot change provider logging');
          } catch(e) {console.error('FAIL representative logging preparation '+(/^[A-Z0-9]{5}$/.test(e.code??'')?e.code:'bounded'));process.exitCode=1;}
          finally {await db.end();}
          JS
      - name: Prepare observed managed privilege defaults for provisioning fixture
        if: inputs.mode == 'provisioning' || inputs.mode == 'combined'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import pg from 'pg';
          const db=new pg.Client({host:'127.0.0.1',port:5432,user:'supabase_admin',password:process.env.MIP_COMPAT_ADMIN_PASSWORD,database:'postgres'});
          let phase='connect';
          try {
            await db.connect();
            phase='provider_identity';
            if((await db.query("select current_user='supabase_admin' and session_user='supabase_admin' and (select rolsuper from pg_roles where rolname=current_user) ok")).rows[0].ok!==true)throw Error('provider_identity');
            phase='group_exists';
            if(!(await db.query("select exists(select 1 from pg_roles where rolname='supabase_privileged_role') present")).rows[0].present)await db.query('CREATE ROLE supabase_privileged_role NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS');
            phase='group_shape';
            if((await db.query("select rolcanlogin or rolsuper or rolcreatedb or rolcreaterole or rolreplication or rolbypassrls unsafe from pg_roles where rolname='supabase_privileged_role'")).rows[0].unsafe)throw Error('privileged_group_shape');
            phase='group_membership';
            await db.query('GRANT supabase_privileged_role TO postgres WITH ADMIN FALSE, INHERIT TRUE, SET FALSE');
            phase='replication_attribute';
            await db.query('ALTER ROLE postgres REPLICATION');
            phase='launch_setting';
            if((await db.query("select current_setting('supautils.privileged_role') role,(select context from pg_settings where name='supautils.privileged_role') context")).rows[0].role!=='supabase_privileged_role')throw Error('provider_launch_setting');
            console.log('PASS disposable provider defaults prepared; no auditor, extension or customer provisioning performed');
          } catch(e) {console.error('FAIL provider privilege preparation '+phase+' '+(/^[A-Z0-9]{5}$/.test(e.code??'')?e.code:'bounded'));process.exitCode=1;}
          finally {await db.end();}
          JS
      - name: Actual managed prerequisite component qualification
        if: inputs.mode == 'provisioning'
        timeout-minutes: 3
        env:
          MIP_MANAGED_PROVISIONING_ARM: synthetic-pg17-only
          MIP_DISPOSABLE_POSTGRES: qik-persistent-install
        run: node --test supabase/qualification/native-provisioning-compat/provision.test.mjs
      - name: Combined managed installation audit and retirement qualification
        if: inputs.mode == 'combined'
        timeout-minutes: 5
        env:
          MIP_MANAGED_PROVISIONING_ARM: synthetic-pg17-only
          MIP_QIK_COMPARISON_DISPOSABLE: synthetic-pg17-only
          MIP_NATIVE_ACTIVATION_ARM: synthetic-pg17-only
          MIP_DISPOSABLE_POSTGRES: qik-persistent-install
        run: node --test supabase/qualification/native-provisioning-compat/integration.test.mjs
      - name: Bound credential delivery and private log canary qualification
        if: inputs.mode == 'credentials'
        timeout-minutes: 3
        env:
          MIP_SECURE_DELIVERY_ARM: synthetic-managed-logging-only
          MIP_DISPOSABLE_POSTGRES: qik-persistent-install
        run: node --test supabase/qualification/native-provisioning-compat/secureCredentialDelivery.test.mjs
      - name: Vault caller-permission capability qualification
        if: inputs.mode == 'vault'
        timeout-minutes: 3
        env:
          MIP_VAULT_CAPABILITY_ARM: synthetic-pg17-local-only
          MIP_DISPOSABLE_POSTGRES: qik-persistent-install
        run: node --test supabase/qualification/native-provisioning-compat/vaultCapability.test.mjs
      - name: Verify unchanged checkout
        if: always()
        run: git diff --exit-code
      - name: Owned disposable cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect qik-managed-compat >/dev/null 2>&1; then
            volumes=$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}' qik-managed-compat)
            docker rm --force --volumes qik-managed-compat
            for volume in $volumes; do
              if docker volume inspect "$volume" >/dev/null 2>&1; then echo 'Owned volume remains'; exit 1; fi
            done
          fi
          if docker container inspect qik-managed-compat >/dev/null 2>&1; then exit 1; fi
# Manual source/synthetic-only qualification. No hosted secrets, artifacts, caches, material or deployment.
