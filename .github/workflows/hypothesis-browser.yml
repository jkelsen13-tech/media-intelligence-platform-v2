name: Synthetic hypothesis interface
on:
  pull_request:
    paths:
      - 'src/components/Hypothesis*.jsx'
      - 'src/lib/hypothesis*.js'
      - 'src/styles/investigation-workspace-panels.css'
      - 'src/styles/tokens.css'
      - 'src/index.css'
      - 'tests/hypothesisAssessmentFixture.mjs'
      - 'tests/hypothesisComposerFixture.mjs'
      - 'verifier/hypothesis-browser/**'
      - '.github/workflows/hypothesis-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Install disposable browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/mip-browser" --no-package-lock --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/mip-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Synthetic interface with all page network requests blocked
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/hypothesis-browser/run.mjs
