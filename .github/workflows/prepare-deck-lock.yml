name: Prepare MapLibre compatible deck lock
on:
  push:
    branches: [fix/maplibre-attribution-security]
    paths: [.github/workflows/prepare-deck-lock.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve exact compatible release without scripts
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); delete p.dependencies['@deck.gl/mapbox']; for(const n of ['core','layers','maplibre']) p.dependencies['@deck.gl/'+n]='9.4.0'; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node --input-type=module -e "import fs from 'node:fs'; const l=JSON.parse(fs.readFileSync('package-lock.json')); for(const p of Object.keys(l.packages)) if(p.startsWith('node_modules/@deck.gl/')||p.startsWith('node_modules/@luma.gl/')) delete l.packages[p]; l.packages[''].dependencies=JSON.parse(fs.readFileSync('package.json')).dependencies; fs.writeFileSync('package-lock.json',JSON.stringify(l,null,2)+'\n')"
          npm install --package-lock-only --ignore-scripts
          node --input-type=module -e "import fs from 'node:fs'; for(const p of ['package.json','package-lock.json']) console.log('MANIFEST:'+p+':'+fs.readFileSync(p).toString('base64'))"
