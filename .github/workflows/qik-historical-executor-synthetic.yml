name: Qik historical executor synthetic qualification
on:
  push:
    branches: [codex/qik-operational-integration-20260927]
    paths: [.github/workflows/qik-historical-executor-synthetic.yml]
permissions:
  contents: read
concurrency:
  group: qik-historical-executor-synthetic
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.repository == 'jkelsen13-tech/media-intelligence-platform-v2' && github.ref == 'refs/heads/codex/qik-operational-integration-20260927'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and synthetic-only boundary
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import hashlib,os,pathlib,subprocess
          source='b405a05ceacaab9c9c238f340556a50f1c08fb86'
          assert os.environ['GITHUB_EVENT_NAME']=='push'
          assert os.environ['GITHUB_REPOSITORY']=='jkelsen13-tech/media-intelligence-platform-v2'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/qik-operational-integration-20260927'
          assert subprocess.check_output(['git','rev-parse',source+'^{tree}'],text=True).strip()=='32d4584ed36ebf97da73e573c32c3634efd25a91'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines()==['.github/workflows/qik-historical-executor-synthetic.yml']
          protected={'verifier/efta-postgres-qualification-manifest.json':'841e0fe52244c224330efd546965f57571549fd7ae08bc07d19853134241c6f9','verifier/eftaPostgresQualification.py':'000eac69f781f1803c19d98ac44388400ee8324feeeb4cd6498e8a984ef65f10'}
          for name,digest in protected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest
          pins={"supabase/qualification/historical-qik-executor/candidate.sql":"6fe6035223de1dac94fba6c238e33324bc0ca266","supabase/qualification/historical-qik-executor/executor.mjs":"fa2e6a6f04287f45ce75ee0ae79e66afea5a3e1a","supabase/qualification/historical-qik-executor/contracts.mjs":"6277ff14cf9009e7bca8b77e9824e4cfb51c1542","supabase/qualification/historical-qik-executor/README.md":"573f1564dca5894f4c59523a5b4e5f09d6ef27b2","tests/historicalQikExecutor.mjs":"bb80465876c7c7c62dd261da260079244445ffa9","tests/historicalQikExecutorPostgres17.test.mjs":"150b59cf3a5680fd991c7f33840aa8f89cfe02a1","supabase/qualification/historical-qik-executor/install.mjs":"d4c72b5e2ff50ce19d46de9c6911135fc0216f48","supabase/qualification/historical-qik-executor/handler.mjs":"d00b3d331e161f0fb269ed26b173d5c7bcc3cb29","supabase/qualification/historical-qik-executor/index.ts":"ebebe21f4bf2eed94070e71d0a8a4e8a4986bbb2","supabase/qualification/historical-qik-executor/deno.json":"ac66847f390776a239ed12087d9c7095019fd4a3","supabase/qualification/historical-qik-executor/config.toml":"e5fe571d97c7f75ed0ae5679013d373817870f47","tests/historicalQikExecutorHandler.test.mjs":"f1780203995e5efc6b65aa86beb87d4946e5eaa4","scripts/mipHistoricalArticleTransferPlan.mjs":"ad30cb603757888840e737694b333c3b6ae234e1","scripts/mipHistoricalArticleTransfer.mjs":"b5b80ee37c6cd068d17f59b506bab6df70839ea6","verifier/qik-history-bounded-adapter-successor.json":"f9bf11f725ee5275ad661ed9a3573a39a760a426"}
          for name,blob in pins.items():
              body=pathlib.Path(name).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()
              assert actual==blob
          config=subprocess.run(['git','config','--get-regexp','http.*.extraheader'],capture_output=True)
          assert config.returncode==1 and not config.stdout
          print('Exact bounded adapter successor source with unchanged SQL/installation and transfer engine. Synthetic-only PG17.6 bootstrap and separate restricted closed-transport profiles plus Node contracts. Actual qik full-engine capacity, secure source/executor bindings, hosted runtime/TLS and real transfer remain unproved. No new material receiving route or historical acceptance.')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test adapter and unchanged planner/transfer contracts
        run: node --test tests/historicalQikExecutor.mjs tests/historicalQikExecutorHandler.test.mjs tests/mipHistoricalArticleTransferPlan.test.mjs tests/mipHistoricalArticleTransfer.test.mjs
      - name: Start owned PostgreSQL 17.6 on loopback only
        shell: bash
        run: |
          docker run --detach --name qik-history-qualification --publish 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=mip-efta-disposable-ci-only -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          for attempt in $(seq 1 30); do
            if docker exec qik-history-qualification pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test actual acquisition snapshot retry and permissions
        timeout-minutes: 4
        env:
          MIP_HISTORICAL_EXECUTOR_DISPOSABLE: synthetic-pg17-only
        run: node --test tests/historicalQikExecutorPostgres17.test.mjs
      - name: Test restricted ordinary installer on preclosed transport and repeat acquisition checks
        timeout-minutes: 4
        env:
          MIP_HISTORICAL_EXECUTOR_DISPOSABLE: synthetic-pg17-only
          MIP_HISTORICAL_EXECUTOR_INSTALL_PROFILE: closed-ordinary
        run: node --test tests/historicalQikExecutorPostgres17.test.mjs
      - name: Remove owned container and volumes and assert absence
        if: always()
        shell: bash
        run: |
          if docker container inspect qik-history-qualification >/dev/null 2>&1; then
            volumes=$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}' qik-history-qualification)
            docker rm --force --volumes qik-history-qualification
            for volume in $volumes; do
              if docker volume inspect "$volume" >/dev/null 2>&1; then exit 1; fi
            done
          fi
          if docker container inspect qik-history-qualification >/dev/null 2>&1; then exit 1; fi
