name: Prepare bounded browser build dependencies
on:
  push:
    branches: ['prep/browserslist-compatibility-20260909']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Resolve compatible transitive patches without scripts
        run: npm update browserslist baseline-browser-mapping --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit generated lock and verify root manifest unchanged
        run: |
          git diff --exit-code -- package.json
          node -e "const fs=require('fs'); const l=fs.readFileSync('package-lock.json'); console.log('MIP_DEP_LOCK='+l.toString('base64'));"
