name: Qik ordered activation and metadata host synthetic qualification
on:
  push:
    branches: [codex/qik-operational-integration-20260927]
    paths: [.github/workflows/qik-runtime-frozen-synthetic.yml]
permissions:
  contents: read
concurrency:
  group: qik-runtime-frozen-synthetic
  cancel-in-progress: false
jobs:
  frozen_synthetic:
    if: github.repository == 'jkelsen13-tech/media-intelligence-platform-v2' && github.ref == 'refs/heads/codex/qik-operational-integration-20260927'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact integrated candidate and closed source authorization
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import hashlib,os,pathlib,subprocess
          source='7fb5375030bbcea36a24edfdd51945dca8a0711d'
          assert os.environ['GITHUB_EVENT_NAME']=='push'
          assert os.environ['GITHUB_REPOSITORY']=='jkelsen13-tech/media-intelligence-platform-v2'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/qik-operational-integration-20260927'
          assert subprocess.check_output(['git','rev-parse',source+'^{tree}'],text=True).strip()=='824cb645f3a7d0f05f9e8b3157adbea3b61027b4'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          subprocess.run(['git','merge-base','--is-ancestor',source,'HEAD'],check=True)
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines()==['.github/workflows/qik-runtime-frozen-synthetic.yml']
          pins={"supabase/qualification/native-governed-activation/001_profile.sql":"11d0bbeb0f5a9114d69dea5613e50dd9e9f3829d","supabase/qualification/native-governed-activation/prepare.mjs":"3d641cc5200408756b9b77c79c8210b58e6b8a4c","supabase/qualification/native-governed-activation/activation.mjs":"c5a7ce9b9098930833b474d60e9a996561e0d2f5","supabase/qualification/native-governed-activation/audit.mjs":"bf9338bf7fa5b6debad39a6948aec3d90b56129f","supabase/qualification/native-governed-install/install.mjs":"aa92f9e5003bbf12b19d4cfbf5871da1c496ce1c","supabase/qualification/qik-comparison-adapter/atomicInstall.mjs":"49fb974fcfcbd745cc05201552fdfbd8af9360ae","tests/nativeGovernedActivation.test.mjs":"e2ae07e1c0f10643db89038b8854ee61898abf85","tests/nativeGovernedActivationPostgres17.test.mjs":"486789ad17497ae9718f5374be9c06087d79a7f5","tests/nativeGovernedInstallerPostgres17.test.mjs":"eb8f6a02e2c52e2d6f48d9981c7f653b6ad0ead3","supabase/qualification/qik-comparison-adapter/compileSource.mjs":"cd87eb0a0bc758315246e74675339f3ea2972a19","supabase/qualification/qik-comparison-adapter/catalogPreflight.mjs":"a591c92b10d174bd2937e9634f8d491b4c34567b","supabase/qualification/qik-ingest/persistentInstall.mjs":"24625b8382399db71e9dba6e3ddb88a936ade33f","supabase/qualification/qik-ingest/installQikIngest.mjs":"fa5d24041b38592ec950e2e46ca28be11f30d997","supabase/qualification/collector-native-capture/authenticatedPgDriver.mjs":"af0f3b69c34695f9241934fae89ac00cedd08515","supabase/qualification/collector-native-capture/credentialDelivery.mjs":"354679fadc48eb9f8a8154456f3d38e7faab3e61","package.json":"68caf5625166966005fff9cd702b3bc6c5fa49ad","package-lock.json":"2b1796f9fa6bf6490f8d935863c8b6dd0a41a7f0","supabase/qualification/native-governed-activation/host.mjs":"5946dc059e926e94723fe75b9925d6e3f7be555a","supabase/qualification/native-governed-activation/run.mjs":"6245ab1497edff0df9bbceb21c3a3df3604ad8a2","tests/nativeGovernedActivationHost.test.mjs":"5eae155039f4101679a5fe0744983cc61f0f082c","supabase/qualification/native-governed-host/adapter.mjs":"47622a1729351d0cabda279d63855b9309e490b0","supabase/qualification/native-governed-activation/README.md":"fa369025d87086b5f3133f369ce413a2b8f3693b",".github/workflows/qik-native-installer-held.yml":"3e64ec316ec90d5ca74679e385bdbe164b5bd58e","verifier/qik-native-activation-successor.json":"a437ea1ce973f0125279c1f5e4724b512d9ef159","supabase/qualification/native-semantic-integration/README.md":"e8deae6b98416ef5136265fdc313a7628bb6ceee","verifier/qik-native-semantic-consumer-successor.json":"92b0c59f87ddb43427a7583ec3479801483c9171"}
          for name,blob in pins.items():
              body=pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==blob
          protected={'verifier/efta-postgres-qualification-manifest.json':'841e0fe52244c224330efd546965f57571549fd7ae08bc07d19853134241c6f9','verifier/eftaPostgresQualification.py':'000eac69f781f1803c19d98ac44388400ee8324feeeb4cd6498e8a984ef65f10'}
          for name,digest in protected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest
          config=subprocess.run(['git','config','--get-regexp','http.*.extraheader'],capture_output=True)
          assert config.returncode==1 and not config.stdout
          print('Affected original v2-v6 + new successor ordered source/synthetic qualification only; semantic67/capacity33 unchanged receipts reused. No hosted install, actual material, activation, publication or accepted candidate.')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify source plans, retry refusals, currentness and both host contracts
        timeout-minutes: 2
        run: node --test tests/nativeGovernedActivation.test.mjs tests/nativeGovernedActivationHost.test.mjs tests/qikComparisonAtomicInstall.test.mjs tests/nativeGovernedHost.test.mjs
      - name: Start pristine PostgreSQL 17.6 for the full ordered installation
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name qik-op-qualification --publish 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=mip-efta-disposable-ci-only -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          for attempt in $(seq 1 30); do
            if docker exec qik-op-qualification pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Build pinned pgvector 0.8.2 for the actual hosted shape
        id: vector_build
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u root qik-op-qualification bash -euc '
            apt-mark hold postgresql-17 postgresql-client-17
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential curl ca-certificates postgresql-server-dev-17
            install -d -m 700 /tmp/qik-vector-build
            cd /tmp/qik-vector-build
            curl --fail --location --max-time 45 --proto "=https" --tlsv1.2 https://codeload.github.com/pgvector/pgvector/tar.gz/cab9da72c04353f143bb06b42ab70a403daac64a -o vector.tar.gz
            echo "0af705b6c9b2a3a1fd1f6fd991425c125387d3c8edc68b75ef027d2e0a05e57a  vector.tar.gz" | sha256sum -c -
            tar -xzf vector.tar.gz --strip-components=1
            make -j2 PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config OPTFLAGS=""
            make PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config install
            dpkg-query -W build-essential postgresql-server-dev-17 postgresql-17 postgresql-client-17
            rm -rf /tmp/qik-vector-build
          '
          test "$(docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification psql -X -h 127.0.0.1 -U postgres -Atc "show server_version_num")" = 170006

      - name: Qualify original v2-v6 and complete successor bootstrap, runtime permissions and independent audit
        if: ${{ !cancelled() && steps.vector_build.outcome == 'success' }}
        timeout-minutes: 7
        env:
          MIP_NATIVE_ACTIVATION_ARM: synthetic-pg17-only
          MIP_NATIVE_GOVERNED_INSTALL_DISPOSABLE: synthetic-pg17-only
          MIP_QIK_COMPARISON_DISPOSABLE: synthetic-pg17-only
          MIP_DISPOSABLE_POSTGRES: qik-persistent-install
        run: node --test --test-concurrency=1 tests/nativeGovernedInstallerPostgres17.test.mjs
      - name: Recheck affected atomic lost-ack reconciliation and actual audit cleanup
        if: ${{ !cancelled() && steps.vector_build.outcome == 'success' }}
        timeout-minutes: 4
        env:
          MIP_QIK_COMPARISON_DISPOSABLE: synthetic-pg17-only
          MIP_DISPOSABLE_POSTGRES: qik-persistent-install
        run: node --test verifier/qikComparisonAtomicInstallPostgres17.mjs
      - name: Verify source and historical assertions remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --quiet
          echo 'Tracked source unchanged; installation and permission proof is synthetic owned PG17.6/vector0.8.2 only, not qik or operating success.'
      - name: Remove disposable database and verify no container or volume remains
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect qik-op-qualification >/dev/null 2>&1; then
            volumes=$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}' qik-op-qualification)
            docker rm --force --volumes qik-op-qualification
            for volume in $volumes; do
              if docker volume inspect "$volume" >/dev/null 2>&1; then echo 'Disposable volume remains'; exit 1; fi
            done
          fi
          if docker container inspect qik-op-qualification >/dev/null 2>&1; then exit 1; fi
