l":"5ae00ef13ce49c29884503b2cb5501bdc442be42","supabase/qualification/hypothesis-assessments/008_authoring_reads.sql":"510ba8865e209b93b926e26a7e1eee32d3bf3f83","supabase/qualification/hypothesis-assessments/014_review_acknowledgements.sql":"a733bc58255cce6b89aac4cc2dac2a99fb2ff430","supabase/qualification/hypothesis-assessments/015_committed_observations.sql":"984a51f370d4e41a58008ee61e387706b06f5dac","supabase/qualification/hypothesis-assessments/016_observation_delivery.sql":"5365db95cc0ac133990d35cbe41c5acd576c5e68","supabase/qualification/hypothesis-assessments/017_external_observation_epoch.sql":"9b2fb4b297d1598d4315e26d8e2d9a66951b43cc","supabase/qualification/mip-cutover-authority/004_publication_staging.sql":"38379113e73d5fea1f3a3dba8647f374ed2733fe","supabase/qualification/mip-cutover-authority/008_operation_evidence.sql":"a1c9f2fb236e7069e80c5a1cfe6b58274c537ee6","tests/changeQueueFixture.sql":"235f92e0ce285cbf5426444b06b576a39adb1e38","tests/hypothesisAssessmentFixture.mjs":"da57f4423665ac422a28ec500b939440e782387e","verifier/comparisonPostgresConcurrency.py":"815902d79aa8986a54d33de1f4b9432eca181278","supabase/qualification/native-semantic-integration/reader.mjs":"949baaf0401f5352a0be04545c1288f3c2354fc7","supabase/qualification/native-semantic-integration/README.md":"341dc09493bd007b3b58ffcc1697d0f8568f16ef","supabase/qualification/hypothesis-assessments/handler.mjs":"551e7dd61a1ba856f281a144fb1423c07af44b44","supabase/qualification/hypothesis-assessments/store.mjs":"286c88ffb8f6fba62900cc532236febca5430d34","tests/nativeSemanticIntegration.test.mjs":"fd0eed9d871882c544013e146bba0de917a9afb4","tests/nativeSemanticIntegrationPostgres17.test.mjs":"0afd47e34511e024d704c00ac92cebee1b53d08d","tests/nativeSemanticIntegrationHttpBridge.mjs":"e1bc8746da0d4f2cfec40838214622e025a98c08","tests/nativeSemanticHandlerIntegration.test.mjs":"2977db312970274b441a5096026941ff2d4dd191","verifier/hypothesisPostgresConcurrency.py":"9b3d914b7f403ca606fa3ab0857e3c44f14aac96","verifier/qik-native-semantic-consumer-successor.json":"7b5f568276e75485369dcdc802dcfd16fcf18993"}
          for name,blob in pins.items():
              body=pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==blob
          protected={'verifier/efta-postgres-qualification-manifest.json':'841e0fe52244c224330efd546965f57571549fd7ae08bc07d19853134241c6f9','verifier/eftaPostgresQualification.py':'000eac69f781f1803c19d98ac44388400ee8324feeeb4cd6498e8a984ef65f10'}
          for name,digest in protected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest
          config=subprocess.run(['git','config','--get-regexp','http.*.extraheader'],capture_output=True)
          assert config.returncode==1 and not config.stdout
          print('New semantic consumer source/synthetic qualification only. Unchanged combined266/history83/frozen57/capacity33 receipts retained. No hosted install, Auth/TLS or actual material.')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify exact semantic requests, HTTP composition and affected existing handlers
        timeout-minutes: 2
        run: node --test tests/semanticAuthorityEnvelope.test.mjs tests/nativeSemanticIntegration.test.mjs tests/nativeSemanticHandlerIntegration.test.mjs tests/hypothesisHandler.test.mjs tests/hypothesisEvidenceBindingStore.test.mjs tests/hypothesisReassessment.test.mjs tests/hypothesisReview.test.mjs
      - name: Start pristine PostgreSQL 17.6 assessment fixture
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          docker run --detach --name qik-op-qualification --publish 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=mip-efta-disposable-ci-only -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          for attempt in $(seq 1 30); do
            if docker exec qik-op-qualification pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              test "$(docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification psql -X -h 127.0.0.1 -U postgres -Atc "show server_version_num")" = 170006
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Qualify actual authenticated assessment producer and retained retry
        timeout-minutes: 3
        env:
          MIP_NATIVE_SEMANTIC_DISPOSABLE: synthetic-pg17-only
        run: node --test tests/nativeSemanticIntegrationPostgres17.test.mjs
      - name: Remove first fixture before separate original hypothesis setup
        shell: bash
        run: |
          set -euo pipefail
          volumes=$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}' qik-op-qualification)
          docker rm --force --volumes qik-op-qualification
          for volume in $volumes; do
            if docker volume inspect "$volume" >/dev/null 2>&1; then exit 1; fi
          done
          if docker container inspect qik-op-qualification >/dev/null 2>&1; then exit 1; fi
      - name: Start pristine original hypothesis PostgreSQL 17.6 fixture
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name qik-semantic-hypothesis --publish 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=mip-disposable-ci-only -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          for attempt in $(seq 1 30); do
            if docker exec qik-semantic-hypothesis pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              test "$(docker exec -e PGPASSWORD=mip-disposable-ci-only qik-semantic-hypothesis psql -X -h 127.0.0.1 -U postgres -Atc "show server_version_num")" = 170006
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Qualify real retained permission change and HTTP read, preserve existing refusals
        timeout-minutes: 4
        env:
          MIP_DISPOSABLE_POSTGRES: comparison-qualification
          PYTHONPATH: verifier
        run: python3 -B -m unittest -v hypothesisPostgresConcurrency.Hypothesis.test_native_semantic_http_reader_with_real_retained_permission_cause hypothesisPostgresConcurrency.Hypothesis.test_retained_method_change_has_exact_receipt_without_new_source_capture hypothesisPostgresConcurrency.Hypothesis.test_permission_revocation_records_each_affected_operation_without_body_text hypothesisPostgresConcurrency.Hypothesis.test_observation_is_user_scoped_and_rechecks_membership_on_retry_and_read
      - name: Verify source and historical assertions remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --quiet
          echo 'Source unchanged. Synthetic authenticated PostgreSQL and Request/Response composition only, not hosted Auth/TLS, installation or operation.'
      - name: Remove both owned fixtures and verify no container or volume remains
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for container in qik-op-qualification qik-semantic-hypothesis; do
            if docker container inspect "$container" >/dev/null 2>&1; then
              volumes=$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}' "$container")
              docker rm --force --volumes "$container"
              for volume in $volumes; do
                if docker volume inspect "$volume" >/dev/null 2>&1; then echo 'Disposable volume remains'; exit 1; fi
              done
            fi
            if docker container inspect "$container" >/dev/null 2>&1; then exit 1; fi
          done
