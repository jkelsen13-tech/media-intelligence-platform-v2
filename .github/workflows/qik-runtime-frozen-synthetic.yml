      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare verified pinned Deno and actual frozen source dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          probe_dir="$(mktemp -d "$RUNNER_TEMP/native-comparison-deno.XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 50000000 \
            'https://github.com/denoland/deno/releases/download/v2.5.2/deno-x86_64-unknown-linux-gnu.zip' -o "$probe_dir/deno.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 --max-filesize 1024 \
            'https://github.com/denoland/deno/releases/download/v2.5.2/deno-x86_64-unknown-linux-gnu.zip.sha256sum' -o "$probe_dir/vendor.sha256sum"
          printf '%s  %s\n' '520fd4bc2d18b50b6ac2ea8b7d0f7f6a35588e412754a081e8c6afd4b15264c4' "$probe_dir/deno.zip" | sha256sum --check --status
          printf '%s  %s\n' '4c0fc62463955fa32e56d43d4d14b37424251e4ab78f14beb33e7092fd083cda' "$probe_dir/vendor.sha256sum" | sha256sum --check --status
          test "$(awk 'NR==1 {print $1}' "$probe_dir/vendor.sha256sum")" = '520fd4bc2d18b50b6ac2ea8b7d0f7f6a35588e412754a081e8c6afd4b15264c4'
          unzip -q "$probe_dir/deno.zip" deno -d "$probe_dir"
          chmod 700 "$probe_dir/deno"
          export DENO_BINARY="$probe_dir/deno"
          export DENO_DIR="$probe_dir/cache"
          export DENO_NO_UPDATE_CHECK=1
          test "$("$DENO_BINARY" --version | head -n 1)" = 'deno 2.5.2 (stable, release, x86_64-unknown-linux-gnu)'
          cfg='supabase/functions/native-comparison-display/deno.json'
          lock='supabase/functions/native-comparison-display/deno.lock'
          test "$(sha256sum "$lock" | awk '{print $1}')" = 'df06499a54915068be7976853021d67c0b6598927c552cf5e6f19b99c404dbe3'
          timeout --signal=KILL 90s "$DENO_BINARY" cache --config="$cfg" --lock="$lock" --frozen --node-modules-dir=none \
            supabase/functions/native-comparison-display/index.ts \
            supabase/qualification/native-comparison-caller/host.mjs \
            tests/nativeComparisonDenoRuntime.mjs \
            tests/historicalQikDenoRuntime.mjs \
            tests/historicalQikCapacityDeno.mjs \
            supabase/qualification/historical-qik-executor/index.ts
          timeout --signal=KILL 90s "$DENO_BINARY" check --config="$cfg" --lock="$lock" --frozen --node-modules-dir=none \
            supabase/functions/native-comparison-display/index.ts \
            supabase/qualification/historical-qik-executor/index.ts
          lock_before="$(sha256sum "$lock" | awk '{print $1}')"
          timeout --signal=KILL 30s "$DENO_BINARY" check --config="$cfg" --lock="$lock" --frozen --node-modules-dir=none \
            supabase/functions/native-comparison-display/index.ts \
            supabase/qualification/historical-qik-executor/index.ts
          test "$(sha256sum "$lock" | awk '{print $1}')" = "$lock_before"
          printf 'DENO_BINARY=%s\nDENO_DIR=%s\nDENO_NO_UPDATE_CHECK=1\n' "$DENO_BINARY" "$DENO_DIR" >> "$GITHUB_ENV"
      - name: Qualify capacity metric parsing and refusal
        timeout-minutes: 1
        run: node --test tests/historicalQikCapacityMetrics.test.mjs
      - name: Start pristine PostgreSQL 17.6 for the full ordered installation
        shell: bash
        run: |
          docker run --detach --name qik-op-qualification --publish 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=mip-efta-disposable-ci-only -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          for attempt in $(seq 1 30); do
            if docker exec qik-op-qualification pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify exact database version and retain unchanged scoped role proof
        timeout-minutes: 2
        env:
          MIP_QIK_ROLE_LIFECYCLE_DISPOSABLE: synthetic-pg17-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker exec -e PGPASSWORD=mip-efta-disposable-ci-only qik-op-qualification psql -X -h 127.0.0.1 -U postgres -Atc "show server_version_num")" = 170006
          echo 'Unchanged scoped role source83705b retained; actual4PASS run36459391029/job109053827943 reused.'
      - name: Measure bounded capacity with bootstrap transport and verify exact custody
        timeout-minutes: 8
        env:
          MIP_HISTORICAL_CAPACITY_DISPOSABLE: synthetic-pg17-only
          MIP_HISTORICAL_EXECUTOR_DISPOSABLE: synthetic-pg17-only
        run: node --test tests/historicalQikExecutorPostgres17.test.mjs
      - name: Repeat capacity and custody with closed ordinary installer
        timeout-minutes: 8
        env:
          MIP_HISTORICAL_CAPACITY_DISPOSABLE: synthetic-pg17-only
          MIP_HISTORICAL_EXECUTOR_DISPOSABLE: synthetic-pg17-only
          MIP_HISTORICAL_EXECUTOR_INSTALL_PROFILE: closed-ordinary
        run: node --test tests/historicalQikExecutorPostgres17.test.mjs
      - name: Verify the pinned lock and tracked source remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum supabase/functions/native-comparison-display/deno.lock | awk '{print $1}')" = 'df06499a54915068be7976853021d67c0b6598927c552cf5e6f19b99c404dbe3'
          git diff --exit-code --quiet
          echo 'Pinned source/lock unchanged; bounded synthetic measurements and authority semantics only, no hosted qualification or actual-material transfer.'
      - name: Remove disposable database and verify no container or volume remains
        if: always()
        shell: bash
        run: |
          if docker container inspect qik-op-qualification >/dev/null 2>&1; then
            volumes=$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}' qik-op-qualification)
            docker rm --force --volumes qik-op-qualification
            for volume in $volumes; do
              if docker volume inspect "$volume" >/dev/null 2>&1; then echo 'Disposable volume remains'; exit 1; fi
            done
          fi
          if docker container inspect qik-op-qualification >/dev/null 2>&1; then exit 1; fi

