name: World View weather preview

on:
  pull_request:
    paths:
      - 'src/lib/investigationInputImpactClient.js'
      - 'src/lib/comparisonPublicationTiming.js'
      - 'src/views/SourceComparisonView.jsx'
      - 'src/views/sourcecomparison.css'
      - 'src/lib/sourceComparisonReadPath.js'
      - 'verifier/runComparisonRecoveryBrowser.mjs'
      - 'src/views/ArcsView.jsx'
      - 'src/components/ArcEvidencePanel.jsx'
      - 'src/lib/useArcArticleInventory.js'
      - 'verifier/runArcSourcesBrowser.mjs'
      - 'supabase/runtime-snapshots/spatial-runtime-v6/**'
      - 'tests/spatialRuntimeRegistration.test.mjs'
      - 'verifier/checkSpatialRuntimeAnonymous.mjs'
      - 'src/graph/GraphView.jsx'
      - 'src/graph/GraphModePanel.jsx'
      - 'src/lib/graphWorkspaceModel.js'
      - 'src/graph/time-records.css'
      - 'verifier/runGraphTimeBrowser.mjs'
      - 'src/components/InvestigationWorkspace.jsx'
      - 'src/lib/workspacePresentation.js'
      - 'src/styles/workspace.css'
      - 'verifier/runWorkspaceShellBrowser.mjs'
      - 'verifier/backendBoundary.mjs'
      - 'src/views/TimelineView.jsx'
      - 'src/lib/chronologyBackend.js'
      - 'src/styles/timeline.css'
      - 'verifier/runTimelineCompositionBrowser.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'src/components/InvestigationVersionNavigation.jsx'
      - 'src/lib/investigationVersionNavigation.js'
      - 'src/styles/investigation-workspace-panels.css'
      - 'verifier/runVersionReferenceBrowser.mjs'
      - 'src/lib/deepLinks.js'
      - 'src/lib/recentInvestigation.js'
      - 'src/lib/investigationEvidenceTrail.js'
      - 'src/components/InvestigationAssessmentTrail.jsx'
      - 'verifier/runRetainedDateBrowser.mjs'
      - 'src/lib/worldViewCameraFraming.js'
      - 'src/lib/worldViewRendererAdapter.js'
      - 'src/lib/worldViewCesiumEllipsoidRendererAdapter.js'
      - 'src/views/WorldMapCanvas.jsx'
      - 'src/lib/eventTimeWeather.js'
      - 'src/lib/weatherSourceRights.js'
      - 'src/views/WorldView.jsx'
      - 'src/views/worldview.css'
      - 'verifier/runWeatherRightsBrowser.mjs'
      - '.github/workflows/world-weather-preview.yml'

permissions:
  contents: read

jobs:
  weather-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Existing public client configuration; no user session or privileged key.
      VITE_SUPABASE_URL: https://qikvmopbtijoebdqosyq.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_7EVSYlCWYiE6YL0bDBYr_w_iwB9tve_
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Verify spatial writer anonymous boundary
        run: node verifier/checkSpatialRuntimeAnonymous.mjs
      - name: Install isolated browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/mip-browser" --no-package-lock --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/mip-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Verify built weather panel on phone and desktop
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runWeatherRightsBrowser.mjs
      - name: Verify exact-version reference form
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runVersionReferenceBrowser.mjs
      - name: Verify retained date precision
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runRetainedDateBrowser.mjs
      - name: Verify shared workspace layout and interactions
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: |
          node verifier/runWorkspaceShellBrowser.mjs
          MIP_BROWSER_ENGINE=webkit node verifier/runWorkspaceShellBrowser.mjs
      - name: Verify Timeline composition and controls
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runTimelineCompositionBrowser.mjs

      - name: Verify Timeline List in WebKit
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
          MIP_TIMELINE_BROWSER: webkit
        run: node verifier/runTimelineCompositionBrowser.mjs

      - name: Verify Graph Time evidence selection
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runGraphTimeBrowser.mjs

      - name: Verify arc source failure and recovery
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runArcSourcesBrowser.mjs

      - name: Verify comparison failure and public recovery
        env:
          MIP_BROWSER_PACKAGE: ${{ runner.temp }}/mip-browser
        run: node verifier/runComparisonRecoveryBrowser.mjs
