name: Qik native installer source and metadata only (held)
# Proposed source only. No push, schedule or automatic dispatch.
# Existing environment admission and secure configuration must be established first.
on:
  workflow_dispatch:
    inputs:
      execute:
        type: choice
        description: Explicit held-route release
        options: [held, run-source-metadata-install]
        default: held
        required: true
      action:
        type: choice
        description: Exact operation; install never automatically retries or activates
        options: [reconcile, install, audit]
        default: reconcile
        required: true
      release_sha:
        type: string
        description: Exact reviewed adapter release commit
        required: true
permissions:
  contents: read
concurrency:
  group: qik-native-atomic-install
  cancel-in-progress: false
jobs:
  metadata-installer:
    if: github.repository == 'jkelsen13-tech/media-intelligence-platform-v2' && inputs.execute == 'run-source-metadata-install'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: qik-forward-controlled
    steps:
      - name: Require exact held-route admission, budget and release
        env:
          ROUTE: ${{ vars.QIK_NATIVE_INSTALL_HOST_ADMISSION }}
          BUDGET: ${{ vars.QIK_NATIVE_INSTALL_BUDGET_ADMISSION }}
          APPROVED: ${{ vars.QIK_APPROVED_RELEASE_SHA }}
          REQUESTED: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ROUTE" = qualified-source-metadata-only-v1
          test "$BUDGET" = within-existing-25-once-10-monthly
          [[ "$APPROVED" =~ ^[a-f0-9]{40}$ ]]
          test "$REQUESTED" = "$APPROVED"
          test "$GITHUB_SHA" = "$APPROVED"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - name: Install locked source runtime without lifecycle scripts
        run: npm ci --omit=dev --ignore-scripts
      - name: Verify pinned public qik CA
        env:
          QIK_CA_PEM_BASE64: ${{ vars.QIK_CA_PEM_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QIK_CA_PEM_BASE64"
          printf '%s' "$QIK_CA_PEM_BASE64" | base64 -d > "$RUNNER_TEMP/qik-native-ca.crt"
          echo '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  '"$RUNNER_TEMP/qik-native-ca.crt" | sha256sum -c -
      - name: Execute one exact disabled installer operation
        timeout-minutes: 10
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/qik-native-ca.crt
          NODE_NO_WARNINGS: '1'
          MIP_NATIVE_HOST_ADMISSION: ${{ vars.QIK_NATIVE_INSTALL_HOST_ADMISSION }}
          MIP_NATIVE_HOST_BUDGET_ADMISSION: ${{ vars.QIK_NATIVE_INSTALL_BUDGET_ADMISSION }}
          QIK_APPROVED_RELEASE_SHA: ${{ vars.QIK_APPROVED_RELEASE_SHA }}
          MIP_NATIVE_HOST_RELEASE_SHA: ${{ inputs.release_sha }}
          MIP_NATIVE_HOST_ACTION: ${{ inputs.action }}
          MIP_NATIVE_HOST_CONFIG_JSON: ${{ vars.QIK_NATIVE_INSTALL_CONFIG_JSON }}
          QIK_NATIVE_INSTALLER_DATABASE_URL: ${{ secrets.QIK_NATIVE_INSTALLER_DATABASE_URL }}
          QIK_NATIVE_AUDIT_DATABASE_URL: ${{ secrets.QIK_NATIVE_AUDIT_DATABASE_URL }}
        run: node supabase/qualification/native-governed-host/run.mjs
      - name: Remove public CA staging
        if: always()
        run: rm -f -- "$RUNNER_TEMP/qik-native-ca.crt"
# No artifact upload, source/capture export, hosted SQL CLI, collector or worker invocation.
