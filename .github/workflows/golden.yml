name: Golden regression suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mip-backend-consolidation-20260920') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # G-ALG-0 added a real runtime dependency (graphology); the suite no
      # longer runs on zero node_modules, so npm ci is required first.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit (triage report)
        if: matrix.node == 24
        continue-on-error: true
        run: npm audit --json

  intake-reader:
    name: C2 portable target compatibility
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mip-backend-consolidation-20260920' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare pinned disposable dependencies
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree} HEAD:src HEAD:tests HEAD:package-lock.json
          ! grep -q extraheader .git/config
          docker pull postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          docker build -f verifier/integrated/native-path.Dockerfile -t mip-c2-python verifier/integrated
      - name: Execute C2 only without external network
        shell: bash
        run: |
          set -euo pipefail
          docker volume create mip-c2-socket
          docker run -d --name mip-c2-pg --network none --memory 512m --pids-limit 128 \
            --security-opt no-new-privileges:true \
            --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=256m \
            --mount type=volume,source=mip-c2-socket,target=/var/run/postgresql \
            -e POSTGRES_PASSWORD=mip-c2-disposable-only \
            postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          stable=0
          for attempt in $(seq 1 60); do
            if docker exec mip-c2-pg pg_isready -U postgres >/dev/null 2>&1; then stable=$((stable + 1)); else stable=0; fi
            if [ "$stable" -ge 5 ]; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' mip-c2-pg)" = none
          test -z "$(docker port mip-c2-pg)"
          docker exec mip-c2-pg createdb -U postgres mip_c2
          docker run --name mip-c2-test --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 65534:65534 --memory 256m --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount type=volume,source=mip-c2-socket,target=/var/run/postgresql,readonly \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            -e MIP_C2_ISOLATION=network-none-socket-only \
            mip-c2-python /workspace/verifier/news-intake/c2_target_compatibility.py
      - name: Preserve diagnostics and remove disposable runtime
        if: always()
        shell: bash
        run: |
          docker logs mip-c2-test 2>&1 || true
          docker inspect mip-c2-pg mip-c2-test --format 'BOUNDARY {{.Name}} network={{.HostConfig.NetworkMode}} memory={{.HostConfig.Memory}} ports={{json .HostConfig.PortBindings}} exit={{.State.ExitCode}}' || true
          docker rm -f -v mip-c2-test mip-c2-pg >/dev/null 2>&1 || true
          docker volume rm mip-c2-socket >/dev/null 2>&1 || true
          test -z "$(docker ps -aq --filter name=^/mip-c2-pg$ --filter name=^/mip-c2-test$)"
          ! docker volume inspect mip-c2-socket >/dev/null 2>&1
          printf '%s\n' 'C2_DISPOSABLE_CLEANUP_PASS'
