name: Golden regression suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mip-backend-consolidation-20260920') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # G-ALG-0 added a real runtime dependency (graphology); the suite no
      # longer runs on zero node_modules, so npm ci is required first.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit (triage report)
        if: matrix.node == 24
        continue-on-error: true
        run: npm audit --json

  intake-reader:
    name: One authorized isolated production build
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mip-backend-consolidation-20260920' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record identity and prepare locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree} HEAD:src HEAD:tests HEAD:package-lock.json HEAD:vite.config.js
          ! grep -q extraheader .git/config
          npm ci --ignore-scripts --no-audit
          docker pull node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
          docker image inspect node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6 --format 'RUNTIME {{.Id}} {{json .RepoDigests}}'
      - name: Single build-only execution with authorized memory exception
        shell: bash
        run: |
          set -euo pipefail
          docker run --name mip-news-build-once --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 4g --pids-limit 128 --ulimit core=0 \
            --tmpfs /tmp:rw,nosuid,size=128m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace \
            node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6 \
            sh -c 'node --max-old-space-size=3072 node_modules/vite/bin/vite.js build --configLoader runner --outDir /tmp/mip-build --emptyOutDir; result=$?; printf "BUILD_EXIT=%s\n" "$result"; if [ -r /sys/fs/cgroup/memory.peak ]; then printf "CGROUP_MEMORY_PEAK_BYTES="; cat /sys/fs/cgroup/memory.peak; else printf "CGROUP_MEMORY_PEAK_UNAVAILABLE\n"; fi; exit "$result"'
      - name: Record boundary and remove disposable build output
        if: always()
        shell: bash
        run: |
          docker inspect mip-news-build-once --format 'BOUNDARY network={{.HostConfig.NetworkMode}} memory={{.HostConfig.Memory}} pids={{.HostConfig.PidsLimit}} ports={{json .HostConfig.PortBindings}} exit={{.State.ExitCode}} oomKilled={{.State.OOMKilled}}' || true
          docker rm -f -v mip-news-build-once >/dev/null 2>&1 || true
          test -z "$(docker ps -aq --filter name=^/mip-news-build-once$)"
          printf '%s\n' 'DISPOSABLE_BUILD_CLEANUP_PASS'
