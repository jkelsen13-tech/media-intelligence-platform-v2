name: Golden regression suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mip-backend-consolidation-20260920') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # G-ALG-0 added a real runtime dependency (graphology); the suite no
      # longer runs on zero node_modules, so npm ci is required first.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit (triage report)
        if: matrix.node == 24
        continue-on-error: true
        run: npm audit --json

  intake-reader:
    name: N1 private nie membership qualification
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mip-backend-consolidation-20260920' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare locked dependencies before isolation
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree}
          ! grep -q extraheader .git/config
          npm ci --ignore-scripts --no-audit
          docker pull node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
      - name: Execute synthetic native membership and staging regressions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --name mip-n1-synthetic --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 65534:65534 \
            --memory 1024m --pids-limit 128 --ulimit core=0 \
            --tmpfs /tmp:rw,nosuid,size=128m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace \
            -e NODE_OPTIONS=--max-old-space-size=768 \
            node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6 \
            node --test --test-concurrency=1 tests/mipNieMembership.test.mjs tests/mipLegacyGraphStaging.test.mjs
      - name: Verify disposable cleanup
        if: always()
        shell: bash
        run: |
          test -z "$(docker ps -aq --filter name=^/mip-n1-synthetic$)"
          printf '%s\\n' 'N1_DISPOSABLE_CLEANUP_PASS'
