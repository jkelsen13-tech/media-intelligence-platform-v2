name: Golden regression suite

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # G-ALG-0 added a real runtime dependency (graphology); the suite no
      # longer runs on zero node_modules, so npm ci is required first.
      - run: npm ci
      - run: npm test
      - run: npm run build
