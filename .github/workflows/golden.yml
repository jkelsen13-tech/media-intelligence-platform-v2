name: Golden regression suite

on:
  push:
    branches-ignore: ['candidate/qik-deno-eof-20260925']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mip-backend-consolidation-20260920') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # G-ALG-0 added a real runtime dependency (graphology); the suite no
      # longer runs on zero node_modules, so npm ci is required first.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit (triage report)
        if: matrix.node == 24
        continue-on-error: true
        run: npm audit --json

  intake-reader:
    name: Bounded native intake to News reader
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mip-backend-consolidation-20260920' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record candidate and prepare source-free utilities
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree}
          ! grep -q extraheader .git/config
          npm ci --ignore-scripts --no-audit
          mkdir -p tests/.compiled
          docker pull postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          docker pull node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
          docker build -f verifier/integrated/native-path.Dockerfile -t mip-news-python verifier/integrated
          docker image inspect postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929 node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6 mip-news-python --format 'RUNTIME {{.Id}} {{json .RepoDigests}}'
      - name: Native reader smoke and bounded build continuation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'SECTION_EXECUTION_STARTED: native intake reader; no source acquisition or restore'
          docker volume create mip-news-socket
          docker run -d --name mip-news-pg --network none --memory 512m --pids-limit 128 \
            --security-opt no-new-privileges:true \
            --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=256m \
            --mount type=volume,source=mip-news-socket,target=/var/run/postgresql \
            -e POSTGRES_PASSWORD=mip-news-disposable-only \
            postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          stable=0
          for attempt in $(seq 1 60); do
            if docker exec mip-news-pg pg_isready -U postgres >/dev/null 2>&1; then stable=$((stable + 1)); else stable=0; fi
            if [ "$stable" -ge 5 ]; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' mip-news-pg)" = none
          test -z "$(docker port mip-news-pg)"
          docker exec mip-news-pg createdb -U postgres mip_news_reader
          docker run -d --name mip-news-bridge --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 65534:65534 --memory 256m --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount type=volume,source=mip-news-socket,target=/var/run/postgresql,readonly \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            -e MIP_NEWS_READER_ISOLATION=network-none-socket-only \
            mip-news-python /workspace/verifier/news-intake/native_reader_slice.py serve
          for attempt in $(seq 1 60); do
            if docker logs mip-news-bridge 2>&1 | grep -q MIP_NEWS_READER_READY; then break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' mip-news-bridge)" != true ]; then
              docker logs mip-news-bridge; exit 1
            fi
            test "$attempt" -lt 60
            sleep 1
          done
          docker logs mip-news-bridge
          docker run --rm --name mip-news-node --network container:mip-news-bridge --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 1024m --pids-limit 128 --ulimit core=0 \
            --tmpfs /tmp:rw,nosuid,size=128m \
            --tmpfs /workspace/tests:rw,nosuid,size=64m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests,target=/source/tests,readonly" \
            --workdir /workspace \
            -e MIP_NEWS_READER_TEST=http://127.0.0.1:8765 \
            node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6 \
            sh -ec 'cp -R /source/tests/. /workspace/tests/; node --test --test-concurrency=1 verifier/news-intake/newsReaderNative.test.mjs; node --max-old-space-size=896 --max-semi-space-size=1 node_modules/vite/bin/vite.js build --configLoader runner --outDir /tmp/mip-build --emptyOutDir'
          printf '%s\n' 'SECTION_EXECUTION_PASS'
      - name: Preserve partial diagnostics and remove disposable runtime
        if: always()
        shell: bash
        run: |
          docker logs mip-news-bridge 2>&1 || true
          docker inspect mip-news-pg mip-news-bridge --format 'BOUNDARY {{.Name}} network={{.HostConfig.NetworkMode}} ports={{json .HostConfig.PortBindings}} status={{.State.Status}}' || true
          docker rm -f -v mip-news-node mip-news-bridge mip-news-pg >/dev/null 2>&1 || true
          docker volume rm mip-news-socket >/dev/null 2>&1 || true
          test -z "$(docker ps -aq --filter name=^/mip-news-pg$ --filter name=^/mip-news-bridge$)"
          ! docker volume inspect mip-news-socket >/dev/null 2>&1
          printf '%s\n' 'DISPOSABLE_CLEANUP_PASS'
