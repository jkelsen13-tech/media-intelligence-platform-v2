<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIP — Media Intelligence Platform</title>

      // Owner-selected light presentation at boot. Cosmetic paint-time hint
      // only — src/lib/themeFlag.js applies light before render.

        document.documentElement.dataset.theme = 'light'

      } catch (e) { /* storage blocked — dataset still set above when possible */ }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
